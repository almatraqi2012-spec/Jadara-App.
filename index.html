<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Mony1 للربح</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-adbox.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .balance { font-size: 35px; color: #0088cc; font-weight: bold; margin: 20px 0; }
        .btn { background: #28a745; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>💰 رصيدك الحالي</h2>
        <div id="balance" class="balance">0.00 $</div>
        <button class="btn" onclick="showAd()">📺 شاهد إعلان واربح $0.02</button>
        <p id="status" style="margin-top:15px; color: #666;"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe.user.id;

        // --- اترك هذه الروابط كما هي الآن، سنعدلها بعد قليل ---
        const SERVER_URL = "سيتم_وضعه_من_TERMUX"; 
        const ADSGRAM_BLOCK_ID = "سيتم_وضعه_من_ADSGRAM";

        async function updateBalance() {
            try {
                const res = await fetch(`${SERVER_URL}/get_user?id=${userId}`);
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance.toFixed(2) + " $";
            } catch (e) { console.log("في انتظار تشغيل الترمكس..."); }
        }
        updateBalance();

        const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

        async function showAd() {
            document.getElementById('status').innerText = "جاري التحميل...";
            try {
                const result = await AdController.show();
                if (result.done) {
                    const res = await fetch(`${SERVER_URL}/add_balance`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ id: userId, amount: 0.02 })
                    });
                    const data = await res.json();
                    document.getElementById('balance').innerText = data.new_balance.toFixed(2) + " $";
                    document.getElementById('status').innerText = "مبروك! تمت إضافة الربح ✅";
                }
            } catch (e) { document.getElementById('status').innerText = "تم إغلاق الإعلان"; }
        }
    </script>
</body>
  </html>
