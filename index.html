<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Mony1 للربح</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/sdk/v1/adsgram.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; text-align: center; padding: 20px; color: #333; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
        h2 { color: #0088cc; margin-bottom: 10px; }
        .balance { font-size: 40px; color: #28a745; font-weight: bold; margin: 20px 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .btn { background: linear-gradient(135deg, #28a745, #218838); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .btn:active { transform: scale(0.98); }
        #status { margin-top: 20px; font-weight: bold; min-height: 24px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>💰 رصيدك الحالي</h2>
        <div id="balance" class="balance">0.00 $</div>
        <button class="btn" onclick="showAd()">📺 شاهد إعلان واربح $0.02</button>
        <p id="status"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        const userId = tg.initDataUnsafe?.user?.id || "guest";

        // --- الإعدادات النهائية (تأكد من بقاء Serveo يعمل في الترمكس) ---
        const SERVER_URL = "https://a6adacbddb552a77-51-38-98-22.serveousercontent.com"; 
        const ADSGRAM_BLOCK_ID = "25980"; 

        // تحديث الرصيد عند فتح التطبيق من الترمكس
        async function updateBalance() {
            try {
                const res = await fetch(`${SERVER_URL}/get_user?id=${userId}`);
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance.toFixed(2) + " $";
                document.getElementById('status').innerText = ""; 
            } catch (e) { 
                document.getElementById('status').style.color = "#666";
                document.getElementById('status').innerText = "جاري الاتصال بسيرفر الترمكس... تأكد من تشغيل Serveo";
            }
        }
        updateBalance();

        // تهيئة وحدة الإعلانات مع وضع التصحيح
        const AdController = window.Adsgram.init({ 
            blockId: ADSGRAM_BLOCK_ID,
            debug: true 
        });

        async function showAd() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.color = "#0088cc";
            statusDiv.innerText = "جاري طلب إعلان من Adsgram... ⏳";
            
            try {
                const result = await AdController.show();
                if (result.done) {
                    statusDiv.innerText = "تمت المشاهدة! جاري إضافة الرصيد... ⚙️";
                    
                    // إرسال الأرباح إلى ملف البايثون في الترمكس
                    const res = await fetch(`${SERVER_URL}/add_balance`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ id: userId, amount: 0.02 })
                    });
                    
                    if (res.ok) {
                        const data = await res.json();
                        document.getElementById('balance').innerText = data.new_balance.toFixed(2) + " $";
                        statusDiv.style.color = "#28a745";
                        statusDiv.innerText = "مبروك! تمت إضافة الربح بنجاح ✅";
                    } else {
                        throw new Error("فشل في تحديث الرصيد بالسيرفر");
                    }
                }
            } catch (e) { 
                console.error("Adsgram Error Detail:", e);
                statusDiv.style.color = "#dc3545";
                
                // رسائل خطأ مفصلة
                if (e.description === "No ads") {
                    statusDiv.innerText = "لا توجد إعلانات متوفرة الآن (حاول تغيير دولة الـ VPN)";
                } else if (e.description === "Block not found") {
                    statusDiv.innerText = "خطأ: رقم الـ Block ID غير صحيح أو لم يفعل بعد";
                } else {
                    statusDiv.innerText = "حدث خطأ: " + (e.description || "تأكد من اتصال الإنترنت");
                }
            }
        }
    </script>
</body>
</html>
